[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "alignbeat"
version = "0.1.0"
description = "AlignBeat: multi-class beat and downbeat tracking from partially labeled data, built on Beat This!"
readme = "README.md"
classifiers = [
    "Intended Audience :: Science/Research",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
]
authors = [
    {name = "Jaehoon Ahn"},
    {name = "Tae Gum Hwang"},
    {name = "Moon-Ryul Jung"},
]
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    # AlignBeat subclasses Beat This!'s model, data module and Lightning module, so
    # the version is pinned to the release it was verified against.
    "beat-this==1.1.0",
    "numpy>=1.20",
    "torch>=2",
    "librosa",
]

[project.optional-dependencies]
train = [
    "pytorch-lightning",
    "pandas",
    "mir_eval",
    "wandb",
    "numba",
]

[tool.setuptools.packages.find]
include = ["alignbeat*"]

[project.urls]
Repository = "https://github.com/zaiisao/AlignBeat"
Paper = "https://arxiv.org/abs/2510.14391"
Upstream = "https://github.com/CPJKU/beat_this"
